<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Аудиоплеер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <h2>music in your pocket</h2>
        
        <div id="drop-zone" class="drop-zone">
            <p>Перетащите аудиофайл (.mp3, .wav) сюда или выберите через кнопку</p>
            <input type="file" id="file-input" accept="audio/*" hidden>
            <button onclick="document.getElementById('file-input').click()">Выбрать файл</button>
        </div>

        <div id="track-name" class="track-name">Файл не выбран</div>

        <audio id="audio-player" controls></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
